name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check tracked source, JSON and credential patterns
        run: python3 tools/check_public.py
      - name: Check retained license texts and release coverage
        run: python3 tools/check_licenses.py
